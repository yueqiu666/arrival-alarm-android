name: Build signed Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: play-release

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Install Android SDK components
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore upload keystore
        shell: pwsh
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ARRIVAL_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:UPLOAD_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\arrival-upload.jks", $bytes)

      - name: Build and verify signed bundle
        shell: pwsh
        working-directory: android-app
        env:
          ARRIVAL_UPLOAD_KEYSTORE: ${{ runner.temp }}\arrival-upload.jks
          ARRIVAL_UPLOAD_STORE_PASSWORD: ${{ secrets.ARRIVAL_UPLOAD_STORE_PASSWORD }}
          ARRIVAL_UPLOAD_KEY_ALIAS: ${{ secrets.ARRIVAL_UPLOAD_KEY_ALIAS }}
          ARRIVAL_UPLOAD_KEY_PASSWORD: ${{ secrets.ARRIVAL_UPLOAD_KEY_PASSWORD }}
          ARRIVAL_AMAP_ANDROID_RELEASE_KEY: ${{ secrets.ARRIVAL_AMAP_ANDROID_RELEASE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARRIVAL_AMAP_ANDROID_RELEASE_KEY)) {
            throw 'Configure ARRIVAL_AMAP_ANDROID_RELEASE_KEY in the play-release environment.'
          }
          .\gradlew.bat clean testDebugUnitTest lintRelease verifyPlayBundle --no-daemon

      - name: Upload signed bundle and mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-play-bundle-signed
          if-no-files-found: error
          path: |
            android-app/build/outputs/bundle/release/*.aab
            android-app/build/outputs/mapping/release/
          retention-days: 14
